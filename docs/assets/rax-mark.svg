<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RAX mark: a chunky tile holding a scaling curve whose points grow as exploration scales,
       rising past the dashed best-prior line. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19d0c8"/>
      <stop offset="1" stop-color="#0a7fb0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="6" width="58" height="56" rx="15" fill="#075e86"/>
  <rect x="3" y="2" width="58" height="56" rx="15" fill="url(#face)"/>
  <rect x="3" y="2" width="58" height="56" rx="15" fill="url(#gloss)"/>
  <line x1="12" y1="33" x2="52" y2="33" stroke="#fff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M13 45 C 22 43, 26 26, 34 22 S 46 16, 50 14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="13" cy="45" r="3" fill="#fff"/>
  <circle cx="24" cy="36.5" r="3.6" fill="#fff"/>
  <circle cx="34" cy="22" r="4.3" fill="#fff"/>
  <circle cx="50" cy="14" r="5.6" fill="#ffb21e" stroke="#fff" stroke-width="2.5"/>
</svg>
