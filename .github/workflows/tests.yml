name: Evo v3 tests

on:
  pull_request:
    branches: [real/evo-v3]
  push:
    branches: [real/evo-v3]

permissions:
  contents: read

concurrency:
  group: evo-v3-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and frontend cancellation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-tests.txt
      - run: python -m pip install -r .github/requirements-tests.txt
      - run: python -m pytest local_tests/unit -q -ra --ignore=local_tests/unit/test_rby1_backend.py
