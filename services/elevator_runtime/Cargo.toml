[package]
name = "rax-elevator-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
libc = "0.2"
hiroz = { git = "https://github.com/ZettaScaleLabs/hiroz.git", rev = "3f289c916737f56157a514a8e846c2791d0ecc4d" }
hiroz-msgs = { git = "https://github.com/ZettaScaleLabs/hiroz.git", rev = "3f289c916737f56157a514a8e846c2791d0ecc4d" }
hiroz-cdr = { git = "https://github.com/ZettaScaleLabs/hiroz.git", rev = "3f289c916737f56157a514a8e846c2791d0ecc4d" }
zenoh-buffers = "=1.9.0"
smart-default = "0.7"
bytemuck = { version = "1", features = ["derive"] }
byteorder = "1.3"

[build-dependencies]
anyhow = "1"
hiroz-codegen = { git = "https://github.com/ZettaScaleLabs/hiroz.git", rev = "3f289c916737f56157a514a8e846c2791d0ecc4d" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("python_registry"))'] }
